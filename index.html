<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANITS - Central Placement Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page login-page">
  <div class="login-title">ANITS - Central Placement Portal</div>

  <div class="login-box">
    <h2>User Login</h2>
    <form onsubmit="return validate()">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Username">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter Password">

      <div id="error" class="error"></div>
      <button type="submit">Login</button>
    </form>
  </div>
</div>

<script>
function validate(){
  let u=document.getElementById("username").value.trim();
  let p=document.getElementById("password").value.trim();
  let e=document.getElementById("error");

  e.innerHTML="";
  if(!u){ e.innerHTML="Please enter username"; return false; }
  if(!p){ e.innerHTML="Please enter password"; return false; }

  window.location.href="success.html";
  return false;
}
</script>
</body>
</html>
